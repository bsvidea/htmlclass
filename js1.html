<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function setname()
        {
            name=document.getElementById("username").value;
            if(name=='')
            {
                alert("enter name ");
                document.getElementById("username").focus();
            }
            else
            {
                console.log(name);
                document.getElementById("titletext").innerText="Welcome "+name.toUpperCase();
            }
        }
    </script>
</head>
<body
    <div>
        <label>Name</label>
        <input type="text" id="username">
        <button onclick="setname()">Click</button>
    </div>
    <h1 id="titletext">Welcome</h1>

</body>
</html>
